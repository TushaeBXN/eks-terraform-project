apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-demo
  labels:
    app: portfolio-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio-demo
  template:
    metadata:
      labels:
        app: portfolio-demo
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
